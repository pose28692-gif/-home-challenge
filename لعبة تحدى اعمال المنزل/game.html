<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Family Wheel - تحدي الأبطال 🎡</title>
    <style>
        :root { --primary: #ff7675; --accent: #6c5ce7; --success: #00b894; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fdfaf5; margin: 0; padding: 0; direction: rtl; }
        
        /* تصميم الغلاف الخارجي */
        .cover-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            text-align: center;
        }
        .game-logo {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .container { max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; display: none; }
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* العجلة والأسهم */
        .wheel-box { position: relative; width: 340px; height: 340px; margin: 40px auto; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .arrow-in { position: absolute; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid var(--primary); z-index: 10; }
        .arrow-label { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 3px 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; font-weight: bold; }
        #arr-0 { top: -35px; left: 50%; transform: translateX(-50%); border-bottom-color: #ff4757; }
        #arr-1 { right: -35px; top: 50%; transform: translateY(-50%) rotate(-90deg); border-bottom-color: #2f3542; }
        #arr-2 { left: -35px; top: 50%; transform: translateY(-50%) rotate(90deg); border-bottom-color: #747d8c; }

        input { padding: 12px; border-radius: 12px; border: 2px solid #eee; margin: 8px; width: 85%; font-size: 16px; text-align: center; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin: 10px; }
        .player-card { background: #fff; padding: 20px; border-radius: 30px; border: 3px solid #f1f2f6; margin-bottom: 20px; }
        .completed { border-color: var(--success); background: #f0fff4; }
        .prize-wheel-mini { width: 150px; height: 150px; margin: 10px auto; display: none; }
        .prize-text { font-weight: bold; color: var(--gold); font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="cover" class="cover-page">
    <div class="game-logo">🎡</div>
    <h1 style="font-size: 40px; margin: 10px;">Family Wheel</h1>
    <p style="font-size: 20px; opacity: 0.9;">تحدي الأبطال.. نفذ المهمة واربح الجائزة!</p>
    <button class="btn" style="background: white; color: var(--accent); padding: 20px 60px;" onclick="startGame()">ابدأ اللعب الآن</button>
</div>

<div class="container" id="mainContainer">
    <div id="setup" class="screen active">
        <h1 style="color: var(--accent);">إعداد التحدي 📝</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div id="tasks">
                <h3>المهام 📝</h3>
                <input type="text" value="غسيل المواعين">
                <input type="text" value="ترويق الصالة">
                <input type="text" value="تلميع الزجاج">
                <input type="text" value="كنس الغرف">
                <input type="text" value="سقي الزرع">
                <input type="text" value="ترتيب السرير">
            </div>
            <div id="players">
                <h3>الأبطال 👥</h3>
                <input type="text" placeholder="اللاعب الأول">
                <input type="text" placeholder="اللاعب الثاني">
                <input type="text" placeholder="اللاعب الثالث">
            </div>
        </div>
        <button class="btn" onclick="goToWheel()">توزيع المهام 🎡</button>
    </div>

    <div id="wheel-screen" class="screen">
        <h2>لف العجلة لتوزيع المهام 🎢</h2>
        <div class="wheel-box" id="main-wheel-box">
            <canvas id="canvas" width="400" height="400"></canvas>
        </div>
        <button class="btn" id="spinMain" onclick="spinMain()">لف العجلة 🚀</button>
    </div>

    <div id="challenge" class="screen">
        <h2>أثبت تنفيذك واربح جائزتك! 🎁</h2>
        <div id="dashboard"></div>
        <button class="btn" style="margin-top:30px; display:none;" id="reloadBtn" onclick="location.reload()">تحدي جديد 🔄</button>
    </div>
</div>

<script>
    let players = [], tasks = [], assignments = [], rotation = 0;
    const colors = ['#ff7675', '#fdcb6e', '#55efc4', '#81ecec', '#a29bfe', '#fab1a0'];
    const prizes = ["اختيار خروجة 🚗", "اختيار فيلم 🎬", "اختيار سناكس 🍿", "إعفاء غداً ✨"];

    function startGame() {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
    }

    function goToWheel() {
        tasks = Array.from(document.querySelectorAll('#tasks input')).map(i => i.value).filter(v => v);
        players = Array.from(document.querySelectorAll('#players input')).map(i => i.value).filter(v => v);
        if(players.length < 1) return;

        const box = document.getElementById('main-wheel-box');
        players.forEach((p, i) => {
            const arrow = document.createElement('div');
            arrow.className = 'arrow-in'; arrow.id = `arr-${i}`;
            arrow.innerHTML = `<span class="arrow-label">${p}</span>`;
            box.appendChild(arrow);
        });

        document.getElementById('setup').classList.remove('active');
        document.getElementById('wheel-screen').classList.add('active');
        drawWheel('canvas', tasks);
    }

    function drawWheel(id, list) {
        const ctx = document.getElementById(id).getContext('2d');
        const slice = (Math.PI * 2) / list.length;
        list.forEach((item, i) => {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(200, 200); ctx.arc(200, 200, 200, slice * i, slice * (i+1));
            ctx.fill(); ctx.stroke(); ctx.translate(200, 200); ctx.rotate(slice * i + slice/2);
            ctx.textAlign = "right"; ctx.fillStyle = "#333"; ctx.font = "bold 15px Arial";
            ctx.fillText(item, 180, 8); ctx.restore();
        });
    }

    function spinMain() {
        document.getElementById('spinMain').disabled = true;
        rotation += Math.floor(Math.random() * 360) + 1440;
        const canvas = document.getElementById('canvas');
        canvas.style.transition = "transform 4s cubic-bezier(0.1, 0, 0.2, 1)";
        canvas.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => {
            const finalDeg = rotation % 360;
            const slice = 360 / tasks.length;
            const offsets = [270, 0, 180];
            assignments = players.map((name, i) => {
                let pos = (finalDeg + offsets[i]) % 360;
                let idx = tasks.length - 1 - Math.floor(pos / slice);
                return { name, task: tasks[idx >= 0 ? idx : 0], gender: name.slice(-1) === 'ة' ? 'f' : 'm' };
            });
            showChallenge();
        }, 4500);
    }

    function showChallenge() {
        document.getElementById('wheel-screen').classList.remove('active');
        document.getElementById('challenge').classList.add('active');
        const db = document.getElementById('dashboard');
        db.innerHTML = assignments.map((p, i) => `
            <div class="player-card" id="card-${i}">
                <h3>${p.name}</h3>
                <p>مهمتك: <b>${p.task}</b></p>
                <div id="timer-${i}" style="font-size:25px; margin:10px;">15:00</div>
                <label class="btn" style="background:var(--accent); font-size:14px;">
                    <input type="file" accept="image/*" capture="camera" style="display:none" onchange="winPrize(this, ${i})">
                    📸 ${p.gender === 'f' ? 'صوري الإثبات' : 'صور الإثبات'}
                </label>
                <div id="prize-zone-${i}">
                    <canvas id="pw-${i}" class="prize-wheel-mini" width="200" height="200"></canvas>
                    <div id="pt-${i}" class="prize-text"></div>
                </div>
            </div>
        `).join("");
        assignments.forEach((_, i) => startTimer(i));
    }

    function startTimer(idx) {
        let time = 900;
        const intrvl = setInterval(() => {
            let m = Math.floor(time/60), s = time%60;
            document.getElementById(`timer-${idx}`).innerText = `${m}:${s<10?'0':''}${s}`;
            if(time-- <= 0) clearInterval(intrvl);
        }, 1000);
    }

    function winPrize(input, idx) {
        const file = input.files[0];
        if(!file || (new Date().getTime() - file.lastModified) > 40000) return alert("صورة حية فوراً!");
        const card = document.getElementById(`card-${idx}`);
        card.classList.add('completed');
        const wheel = document.getElementById(`pw-${idx}`);
        wheel.style.display = 'block';
        drawWheel(`pw-${idx}`, prizes);
        let rot = 1440 + Math.floor(Math.random() * 360);
        wheel.style.transition = "transform 3s ease-out";
        wheel.style.transform = `rotate(${rot}deg)`;
        setTimeout(() => {
            const pIdx = prizes.length - 1 - Math.floor((rot % 360) / (360/prizes.length));
            document.getElementById(`pt-${idx}`).innerText = `🎉 مبروك! جائزتك: ${prizes[pIdx >= 0 ? pIdx : 0]}`;
            document.getElementById('reloadBtn').style.display = 'inline-block';
        }, 3200);
    }
</script>
</body>
</html>
