<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Family Wheel - نظام المستويات 🏆</title>
    <style>
        :root { --primary: #ff7675; --accent: #6c5ce7; --success: #00b894; --error: #d63031; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fdfaf5; margin: 0; padding: 0; direction: rtl; }
        .cover-page { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; text-align: center; }
        .game-logo { width: 120px; height: 120px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; display: none; }
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .wheel-box { position: relative; width: 320px; height: 320px; margin: 40px auto; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .arrow-in { position: absolute; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid var(--primary); z-index: 10; }
        .arrow-label { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 3px 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; font-weight: bold; }
        #arr-0 { top: -35px; left: 50%; transform: translateX(-50%); border-bottom-color: #ff4757; }
        #arr-1 { right: -35px; top: 50%; transform: translateY(-50%) rotate(-90deg); border-bottom-color: #2f3542; }
        #arr-2 { left: -35px; top: 50%; transform: translateY(-50%) rotate(90deg); border-bottom-color: #747d8c; }
        input { padding: 12px; border-radius: 12px; border: 2px solid #eee; margin: 8px; width: 85%; font-size: 16px; text-align: center; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin: 10px; }
        .player-card { background: #fff; padding: 25px; border-radius: 35px; border: 4px solid #f1f2f6; transition: 0.3s; }
        .completed { border-color: var(--success) !important; background: #f0fff4; }
        .mini-canvas { width: 160px; height: 160px; border-radius: 50%; border: 4px solid #fff; }
        .level-badge { background: var(--gold); color: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div id="cover" class="cover-page">
    <div class="game-logo">🎡</div>
    <h1>Family Wheel</h1>
    <p>نظام المستويات: نفذ 6 مهام لتفتح صندوق الجوائز!</p>
    <button class="btn" style="background: white; color: var(--accent);" onclick="startGame()">ابدأ التحدي</button>
</div>

<div class="container" id="mainContainer">
    <div id="setup" class="screen active">
        <h2 style="color: var(--accent);">تجهيز الـ 6 مهام 📝</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div id="tasks-input">
                <input type="text" value="غسيل المواعين"> <input type="text" value="ترويق الصالة">
                <input type="text" value="تلميع المرايات"> <input type="text" value="كنس الغرف">
                <input type="text" value="سقي الزرع"> <input type="text" value="ترتيب السرير">
            </div>
            <div id="players-input">
                <input type="text" placeholder="اللاعب الأول">
                <input type="text" placeholder="اللاعب الثاني">
                <input type="text" placeholder="اللاعب الثالث">
            </div>
        </div>
        <button class="btn" onclick="initWheel()">ابدأ المستوى الأول 🚀</button>
    </div>

    <div id="wheel-screen" class="screen">
        <div class="level-badge" id="level-text">المستوى 1: توزيع أول 3 مهام</div>
        <div class="wheel-box" id="main-wheel-box">
            <canvas id="mainCanvas" width="400" height="400"></canvas>
        </div>
        <button class="btn" id="spinBtn" onclick="spinMain()">لف العجلة 🚀</button>
    </div>

    <div id="challenge-screen" class="screen">
        <h2 id="round-title">الجولة الحالية</h2>
        <div class="players-grid" id="dashboard" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;"></div>
        <div id="next-level-zone" style="display:none; margin-top:30px;">
            <button class="btn" style="background:var(--accent)" onclick="startLevelTwo()">انتقل للمستوى الثاني (المهام المتبقية) ➡️</button>
        </div>
        <div id="final-prizes-zone" style="display:none; margin-top:30px; border-top: 5px dashed var(--gold); padding-top:20px;">
            <h1 style="color:var(--gold)">🏆 تم إنجاز الـ 6 مهام! وقت الجوائز 🏆</h1>
            <div id="prizes-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;"></div>
            <button class="btn" onclick="location.reload()">لعبة جديدة 🔄</button>
        </div>
    </div>
</div>

<script>
    let players = [], allTasks = [], currentTasks = [], assignments = [], totalFinished = 0, currentLevel = 1;
    let playerScores = {}; // لتخزين عدد المهام المنفذة لكل لاعب
    const colors = ['#ff7675', '#fdcb6e', '#55efc4', '#81ecec', '#a29bfe', '#fab1a0'];
    const prizeList = ["خروجة 🚗", "فيلم 🎬", "سناكس 🍿", "إعفاء غداً ✨"];

    function startGame() {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
    }

    function initWheel() {
        allTasks = Array.from(document.querySelectorAll('#tasks-input input')).map(i => i.value).filter(v => v);
        players = Array.from(document.querySelectorAll('#players-input input')).map(i => i.value).filter(v => v);
        if(players.length !== 3) return alert("يجب إدخال 3 لاعبين بالضبط لنظام المستويات!");
        
        players.forEach(p => playerScores[p] = 0);
        setupLevel();
    }

    function setupLevel() {
        currentTasks = (currentLevel === 1) ? allTasks.slice(0,3) : allTasks.slice(3,6);
        document.getElementById('level-text').innerText = `المستوى ${currentLevel}: توزيع 3 مهام`;
        
        const box = document.getElementById('main-wheel-box');
        box.querySelectorAll('.arrow-in').forEach(a => a.remove());
        players.forEach((p, i) => {
            const arrow = document.createElement('div');
            arrow.className = 'arrow-in'; arrow.id = `arr-${i}`;
            arrow.innerHTML = `<span class="arrow-label">${p}</span>`;
            box.appendChild(arrow);
        });

        document.getElementById('setup').classList.remove('active');
        document.getElementById('wheel-screen').classList.add('active');
        document.getElementById('challenge-screen').classList.remove('active');
        drawWheel('mainCanvas', currentTasks);
        document.getElementById('spinBtn').disabled = false;
    }

    function drawWheel(id, list) {
        const ctx = document.getElementById(id).getContext('2d');
        const slice = (Math.PI * 2) / list.length;
        ctx.clearRect(0,0,400,400);
        list.forEach((text, i) => {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(200, 200); ctx.arc(200, 200, 200, slice * i, slice * (i+1)); ctx.fill();
            ctx.translate(200, 200); ctx.rotate(slice * i + slice/2);
            ctx.textAlign = "right"; ctx.fillStyle = "#333"; ctx.font = "bold 16px Arial";
            ctx.fillText(text, 180, 8); ctx.restore();
        });
    }

    function spinMain() {
        document.getElementById('spinBtn').disabled = true;
        let rot = Math.floor(Math.random() * 360) + 1440;
        const canvas = document.getElementById('mainCanvas');
        canvas.style.transition = "transform 4s cubic-bezier(0.1, 0, 0.2, 1)";
        canvas.style.transform = `rotate(${rot}deg)`;

        setTimeout(() => {
            assignments = players.map((name, i) => {
                let pos = (rot + [270, 0, 180][i]) % 360;
                let idx = currentTasks.length - 1 - Math.floor(pos / (360/currentTasks.length));
                return { name, task: currentTasks[idx >= 0 ? idx : 0], done: false };
            });
            renderChallenge();
        }, 4500);
    }

    function renderChallenge() {
        document.getElementById('wheel-screen').classList.remove('active');
        document.getElementById('challenge-screen').classList.add('active');
        document.getElementById('round-title').innerText = `المستوى ${currentLevel}: نفذوا مهامكم!`;
        const db = document.getElementById('dashboard');
        db.innerHTML = assignments.map((p, i) => `
            <div class="player-card" id="card-${i}">
                <h4>${p.name}</h4>
                <p style="font-size:14px">المهمة: <b>${p.task}</b></p>
                <input type="file" accept="image/*" capture="camera" id="file-${i}" style="display:none" onchange="verify(${i})">
                <button class="btn" style="padding:10px 20px; font-size:12px" onclick="document.getElementById('file-${i}').click()">📸 تصوير</button>
            </div>
        `).join("");
    }

    function verify(idx) {
        assignments[idx].done = true;
        document.getElementById(`card-${idx}`).classList.add('completed');
        document.getElementById(`card-${idx}`).innerHTML += "✅ تم";
        
        if(assignments.every(a => a.done)) {
            if(currentLevel === 1) {
                document.getElementById('next-level-zone').style.display = 'block';
            } else {
                showFinalPrizes();
            }
        }
    }

    function startLevelTwo() {
        currentLevel = 2;
        document.getElementById('next-level-zone').style.display = 'none';
        setupLevel();
    }

    function showFinalPrizes() {
        document.getElementById('dashboard').style.opacity = '0.3';
        document.getElementById('final-prizes-zone').style.display = 'block';
        const grid = document.getElementById('prizes-grid');
        let availablePrizes = [...prizeList];

        grid.innerHTML = players.map((p, i) => `
            <div class="player-card completed">
                <h3>${p}</h3>
                <canvas id="prize-canvas-${i}" class="mini-canvas" width="400" height="400"></canvas>
                <div id="prize-text-${i}" style="font-weight:bold; color:var(--accent); margin-top:10px;">...</div>
            </div>
        `).join("");

        players.forEach((p, i) => {
            drawWheel(`prize-canvas-${i}`, availablePrizes);
            let rot = 1440 + Math.floor(Math.random() * 360);
            document.getElementById(`prize-canvas-${i}`).style.transition = "transform 3s ease-out";
            document.getElementById(`prize-canvas-${i}`).style.transform = `rotate(${rot}deg)`;

            setTimeout(() => {
                let pIdx = availablePrizes.length - 1 - Math.floor((rot % 360) / (360/availablePrizes.length));
                let win = availablePrizes.splice(pIdx, 1)[0];
                document.getElementById(`prize-text-${i}`).innerText = `🎁 جائزتك: ${win}`;
            }, 3200);
        });
    }
</script>
</body>
</html>
